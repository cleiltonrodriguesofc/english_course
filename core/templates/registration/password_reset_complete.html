{% extends 'base.html' %}

{% block title %}Password Reset Complete - English Course{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 460px;
        margin: 4rem auto;
        padding: 3rem;
        text-align: center;
    }

    .status-icon {
        width: 64px;
        height: 64px;
        background: rgba(34, 197, 94, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        color: #22c55e;
        font-size: 1.5rem;
    }

    .auth-title {
        font-family: 'Outfit', sans-serif;
        font-size: 1.75rem;
        margin-bottom: 1.5rem;
        color: var(--text-primary);
    }

    .auth-description {
        color: var(--text-secondary);
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 2.5rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="glass auth-container animate-fade">
    <div class="status-icon">
        <i class="fas fa-check"></i>
    </div>
    
    <h2 class="auth-title">Senha Alterada! 🎉</h2>
    
    <p class="auth-description">
        Sua senha foi redefinida com sucesso. Você já pode acessar sua conta.
    </p>

    <div style="margin-top: 3rem;">
        <a href="{% url 'login' %}" class="btn btn-primary" style="padding: 0.875rem 2rem;">
            Entrar Agora
        </a>
    </div>
</div>
{% endblock %}
